name: Test

# Shared checks, called by the pull request and deploy workflows. No AWS access.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Unit and end-to-end tests (mocked AWS)
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Lambda build is reproducible
        run: |
          bash scripts/build.sh > /dev/null
          sha256sum build/functions/*.zip > /tmp/first
          bash scripts/build.sh > /dev/null
          sha256sum build/functions/*.zip | diff /tmp/first - \
            || { echo "::error::scripts/build.sh produced different zips from the same commit"; exit 1; }

      - name: API image builds and serves
        run: |
          docker build --platform linux/amd64 -t frontrow-api:ci .
          docker run -d --name api --read-only --tmpfs /tmp -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/c.db -e AWS_DEFAULT_REGION=ap-south-1 -e SERVED_BY=ci frontrow-api:ci
          docker exec api python seed_catalog.py
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/events > /dev/null
          curl -fs localhost:8000/metrics | grep -q frontrow_http_requests_total
          docker rm -f api

      - name: Kubernetes manifests render and validate
        run: |
          pip install pyyaml
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          bash scripts/check-deploy.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: terraform fmt and validate
        run: |
          terraform fmt -check -recursive terraform
          for dir in terraform terraform/shared terraform/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate
          done
