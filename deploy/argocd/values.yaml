# Argo CD, installed once by Terraform (terraform/argocd.tf). After that it
# manages everything else in the cluster from deploy/root.
global:
  domain: argocd.local # reached with kubectl port-forward, never exposed publicly

configs:
  params:
    server.insecure: true # TLS ends at the port-forward; there is no ingress
  cm:
    timeout.reconciliation: 120s
    # Let sync waves wait for child Applications to be healthy (app of apps).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1

controller:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
